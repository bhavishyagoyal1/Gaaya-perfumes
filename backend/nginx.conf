# ============================================================
# Nginx Configuration — Gaaya Perfumes Production
# Place at: /etc/nginx/sites-available/gaayaperfumes.com
# Enable: sudo ln -s /etc/nginx/sites-available/gaayaperfumes.com /etc/nginx/sites-enabled/
# ============================================================

# Upstream Node.js app (PM2 cluster)
upstream gaaya_app {
    least_conn;                        # route to least busy worker
    server 127.0.0.1:3000 fail_timeout=5s max_fails=3;
    keepalive 64;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gaayaperfumes.com www.gaayaperfumes.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Redirect www → non-www (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.gaayaperfumes.com;

    ssl_certificate     /etc/letsencrypt/live/gaayaperfumes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gaayaperfumes.com/privkey.pem;

    return 301 https://gaayaperfumes.com$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gaayaperfumes.com;

    # ── SSL Certificates (auto-managed by Certbot) ──
    ssl_certificate     /etc/letsencrypt/live/gaayaperfumes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gaayaperfumes.com/privkey.pem;

    # ── SSL Hardening ──
    ssl_session_timeout    1d;
    ssl_session_cache      shared:MozSSL:10m;
    ssl_session_tickets    off;
    ssl_protocols          TLSv1.2 TLSv1.3;
    ssl_ciphers            ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_stapling           on;
    ssl_stapling_verify    on;

    # ── Security Headers ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY"                                          always;
    add_header X-Content-Type-Options     "nosniff"                                       always;
    add_header X-XSS-Protection           "1; mode=block"                                 always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"      always;

    # Hide Nginx version
    server_tokens off;

    # ── Rate Limiting at Nginx level ──
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=contact:10m rate=1r/m;

    # ── Gzip Compression ──
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml font/woff2;

    # ── Logs ──
    access_log /var/log/nginx/gaaya_access.log combined buffer=512k flush=1m;
    error_log  /var/log/nginx/gaaya_error.log  warn;

    # ── Request Size Limit ──
    client_max_body_size 1M;

    # ── Contact API — extra strict rate limiting ──
    location /api/contact {
        limit_req zone=contact burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://gaaya_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── All other API routes ──
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://gaaya_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }

    # ── Static files — served directly by Nginx (fast!) ──
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/gaaya-perfumes/current;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Main app ──
    location / {
        proxy_pass         http://gaaya_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
    }
}
